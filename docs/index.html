  <h1>snake</h1>
  <p>Minimal CLI snake in C++20. No dependencies — just CMake + a C++20 compiler.</p>
  <h2>Build &amp; run</h2>
  <pre>cmake -B build -DCMAKE_BUILD_TYPE=Release
cmake --build build -j
./build/snake</pre>
  <h2>Keys</h2>
  <p>Arrows / WASD move · <code>p</code> pause · <code>r</code> restart · <code>q</code> quit.</p>
  <p><a href="https://github.com/lupo21/snake">Source on GitHub</a></p>
